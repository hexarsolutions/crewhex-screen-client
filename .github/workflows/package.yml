name: package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.11']        # Bullseye and Bookworm system Pythons
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.python }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Syntax + generated kiosk is current
        run: |
          python3 -m py_compile client/screen_client.py client/launch.py
          bash -n install.sh
          python3 tools/build_kiosk.py --check
          node -e "new Function(require('fs').readFileSync('kiosk-src/player.js','utf8'))"
      - name: Version consistency
        run: |
          python3 - <<'PY'
          import re, pathlib
          root = pathlib.Path('.')
          v = (root/'client'/'VERSION').read_text().strip()
          player = (root/'kiosk-src'/'player.js').read_text()
          built = (root/'client'/'kiosk'/'index.html').read_text()
          assert "window.CHX_VERSION || '%s'" % v in player, "player.js version fallback drifted from client/VERSION"
          assert "window.CHX_VERSION='%s'" % v in built, "kiosk build did not inject client/VERSION"
          print("version", v, "consistent")
          PY
          python3 - <<'PY'
          import re, pathlib
          src = (pathlib.Path('.')/'install.sh').read_text()
          pem = re.search(r"OTA_PUBKEY_PEM=\"\$\(cat <<'PEM'\n(.*?)\nPEM", src, re.S)
          assert pem, "install.sh must embed the OTA public key"
          assert pem.group(1).strip() == (pathlib.Path('client')/'ota_pubkey.pem').read_text().strip()
          assert src.index('KIOSK_HOME=$(getent passwd') < src.index('mkdir -p "$KIOSK_HOME/.config/crewhex-kiosk"')
          print("installer key + ordering ok")
          PY

      - name: Resolver parity (same cases as the server)
        run: node kiosk-src/resolver.test.cjs
      - name: Client contract tests
        run: |
          pip install pytest
          python3 -m pytest -q tests
      - name: Smoke - boots into pairing with no server
        run: |
          mkdir -p /tmp/smoke
          echo '{"api_base":"http://127.0.0.1:9","port":8123}' > /tmp/smoke/config.json
          SCREEN_CONFIG=/tmp/smoke/config.json SCREEN_STATE=/tmp/smoke/state/device.json \
            timeout 6 python3 client/launch.py &
          sleep 3
          curl -fsS -H 'X-CrewHex-Kiosk: 1' http://127.0.0.1:8123/api/status | tee /tmp/smoke/status.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8123/api/status)" = 403
          curl -fsS http://127.0.0.1:8123/ | grep -q "CHX_TRANSPORT='local'"
          python3 -c "import json; s=json.load(open('/tmp/smoke/status.json')); assert s['mode']=='pairing', s; print('ok', s['client_version'])"
          wait || true

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: |
          VER="${GITHUB_REF_NAME:-main}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "v$(cat client/VERSION)" = "$VER" || { echo "tag $VER != client/VERSION $(cat client/VERSION)"; exit 1; }
          fi
          PKG="crewhex-screen-client-${VER}"
          mkdir -p "/tmp/${PKG}"
          cp -r client install.sh README.md docs "/tmp/${PKG}/"
          find "/tmp/${PKG}" -name __pycache__ -prune -exec rm -rf {} +
          tar -czf "${PKG}.tar.gz" -C /tmp "${PKG}"
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"
          # OTA bundle: client/ at archive root, regular files only (the client rejects anything else).
          OTA="screen-client-${VER#v}"
          mkdir -p "/tmp/${OTA}"
          cp -r client "/tmp/${OTA}/client"
          find "/tmp/${OTA}" -name __pycache__ -prune -exec rm -rf {} +
          tar -czf "${OTA}.tar.gz" --owner=0 --group=0 -C "/tmp/${OTA}" client
          sha256sum "${OTA}.tar.gz" | cut -d' ' -f1 > "${OTA}.tar.gz.sha256"
          echo "OTA=${OTA}.tar.gz" >> "$GITHUB_ENV"
      # Signing happens HERE and only here: the private key lives in the repo's
      # OTA_SIGNING_KEY secret, not on anyone's laptop.
      - name: Sign OTA bundle (ed25519)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          test -n "$OTA_SIGNING_KEY" || { echo "OTA_SIGNING_KEY secret missing - refusing to release unsigned"; exit 1; }
          test -f client/ota_pubkey.pem || { echo "client/ota_pubkey.pem missing - screens could not verify"; exit 1; }
          umask 077; printf '%s\n' "$OTA_SIGNING_KEY" > /tmp/ota.key
          openssl pkeyutl -sign -inkey /tmp/ota.key -rawin -in "$OTA" -out "$OTA.sig"
          openssl pkeyutl -verify -pubin -inkey client/ota_pubkey.pem -rawin -in "$OTA" -sigfile "$OTA.sig"
          rm -f /tmp/ota.key
      - uses: actions/upload-artifact@v7
        with:
          name: crewhex-screen-client
          path: |
            crewhex-screen-client-*.tar.gz*
            screen-client-*.tar.gz*
      - name: Publish the signed bundle to the CrewHex VM (tags only)
        if: startsWith(github.ref, 'refs/tags/v') && env.DEPLOY_KEY != ''
        env:
          DEPLOY_KEY: ${{ secrets.CREWHEX_DEPLOY_KEY }}
        run: |
          # Restricted deploy key: it may only write /srv/crewhex/public on the VM.
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > /tmp/deploy.key
          VER="${GITHUB_REF_NAME#v}"
          scp -o StrictHostKeyChecking=accept-new -i /tmp/deploy.key \
            "$OTA" "$OTA.sig" "screen-client-${VER}.tar.gz" "screen-client-${VER}.tar.gz.sig" \
            deploy@api.crewhex.com:/srv/crewhex/public/
          scp -o StrictHostKeyChecking=accept-new -i /tmp/deploy.key \
            "screen-client-${VER}.tar.gz" deploy@api.crewhex.com:/srv/crewhex/public/screen-client-latest.tar.gz
          scp -o StrictHostKeyChecking=accept-new -i /tmp/deploy.key \
            "screen-client-${VER}.tar.gz.sig" deploy@api.crewhex.com:/srv/crewhex/public/screen-client-latest.tar.gz.sig
          sha256sum "screen-client-${VER}.tar.gz" | cut -d' ' -f1 | ssh -i /tmp/deploy.key deploy@api.crewhex.com \
            "tee /srv/crewhex/public/screen-client-${VER}.tar.gz.sha256 /srv/crewhex/public/screen-client-latest.tar.gz.sha256 >/dev/null"
          rm -f /tmp/deploy.key
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            crewhex-screen-client-*.tar.gz
            crewhex-screen-client-*.tar.gz.sha256
            screen-client-*.tar.gz
            screen-client-*.tar.gz.sha256
            screen-client-*.tar.gz.sig
