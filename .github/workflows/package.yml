name: package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax checks
        run: |
          python3 -m py_compile client/screen_client.py
          python3 - <<'PY'
          import json, pathlib
          html = pathlib.Path('client/kiosk/index.html').read_text()
          assert 'pairVeil' in html and 'api/status' in html, 'kiosk missing expected hooks'
          json.loads(pathlib.Path('docs/PROTOCOL.md').read_text().split('```json')[1].split('```')[0])
          print('checks OK')
          PY
          bash -n install.sh

      - name: Client smoke test (no server - pairing mode)
        run: |
          mkdir -p /tmp/smoke
          SCREEN_CONFIG=/tmp/smoke/config.json SCREEN_STATE=/tmp/smoke/state.json \
            timeout 4 python3 client/screen_client.py --port 8123 &
          sleep 2
          curl -fsS http://127.0.0.1:8123/api/status | tee /tmp/smoke/status.json
          curl -fsS http://127.0.0.1:8123/ | grep -q pairVeil
          python3 - <<'PY'
          import json
          s = json.load(open('/tmp/smoke/status.json'))
          assert s['mode'] == 'pairing' and s['pairing_pin'], s
          import re
          assert re.fullmatch(r'[2-9]{6}', s['pairing_pin']), s
          print('pairing PIN served:', s['pairing_pin'])
          PY
          wait || true

      - name: Package
        run: |
          VER="${GITHUB_REF_NAME:-main}"
          PKG="crewhex-screen-client-${VER}"
          mkdir -p "/tmp/${PKG}"
          cp -r client install.sh README.md docs "/tmp/${PKG}/"
          rm -rf "/tmp/${PKG}/client/__pycache__"
          tar -czf "${PKG}.tar.gz" -C /tmp "${PKG}"
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"

          # OTA bundle has client/ at archive root, as apply_update expects.
          OTA="screen-client-${VER}"
          mkdir -p "/tmp/${OTA}"
          cp -r client "/tmp/${OTA}/client"
          rm -rf "/tmp/${OTA}/client/__pycache__"
          tar -czf "${OTA}.tar.gz" -C "/tmp/${OTA}" client
          sha256sum "${OTA}.tar.gz" > "${OTA}.tar.gz.sha256"
          echo "PKG=${PKG}.tar.gz" >> "$GITHUB_ENV"
          echo "OTA=${OTA}.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: crewhex-screen-client
          path: |
            crewhex-screen-client-*.tar.gz
            crewhex-screen-client-*.tar.gz.sha256
            screen-client-*.tar.gz
            screen-client-*.tar.gz.sha256

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            crewhex-screen-client-*.tar.gz
            crewhex-screen-client-*.tar.gz.sha256
            screen-client-*.tar.gz
            screen-client-*.tar.gz.sha256
